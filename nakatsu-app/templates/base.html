<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>{% block title %}{% endblock %} - 中津花市場</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
