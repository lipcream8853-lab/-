{% extends "base.html" %}{% block title %}品目{% endblock %}
{% block body %}
<h1>品目マスタ</h1>
<form method="post" class="grid">
  <input type="hidden" name="id" value="{{ edit.id if edit }}">
  <label>コード<input name="code" required value="{{ edit.code if edit }}"></label>
  <label>品名<input name="name" required value="{{ edit.name if edit }}"></label>
  <label>単位<input name="unit" value="{{ edit.unit if edit else '束' }}"></label>
  <label>標準単価<input type="number" name="default_price" min="0" value="{{ edit.default_price if edit else 0 }}"></label>
  <label>税率<select name="tax_rate"><option value="8" {{ 'selected' if edit and edit.tax_rate==8 }}>8%(軽減)</option><option value="10" {{ 'selected' if edit and edit.tax_rate==10 }}>10%</option></select></label>
  <button>{{ '更新' if edit else '追加' }}</button>
</form>
<table><tr><th>コード<th>品名<th>単位<th>標準単価<th>税率<th></tr>
{% for r in rows %}<tr><td>{{ r.code }}<td>{{ r.name }}<td>{{ r.unit }}<td class="num">{{ r.default_price|yen }}<td>{{ r.tax_rate }}%
<td><a href="?edit={{ r.id }}">編集</a>
<form method="post" action="{{ url_for('item_delete', iid=r.id) }}" style="display:inline" onsubmit="return confirm('無効にしますか？')"><button class="link">削除</button></form></tr>{% endfor %}
</table>
{% endblock %}
